<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KFCoding switcher UI preview</title>
  <style>
    body { margin: 0; min-height: 100vh; background: #e8ece9; color: #26312b; font: 14px/1.5 sans-serif; }
    main { width: min(980px, calc(100% - 40px)); margin: 48px auto; }
    .line { height: 12px; margin: 14px 0; background: #d5ddd8; }
    .line:nth-child(2n) { width: 72%; }
  </style>
</head>
<body>
  <main aria-hidden="true">
    <h1>Provider usage</h1>
    <div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div>
  </main>
  <script>
    const values = new Map();
    window.GM_getValue = (key, fallback) => values.has(key) ? values.get(key) : fallback;
    window.GM_setValue = (key, value) => values.set(key, value);
    window.GM_registerMenuCommand = () => {};
    window.GM_notification = () => {};
    window.GM_openInTab = () => {};
    window.GM_xmlhttpRequest = ({ onload }) => setTimeout(() => onload({ status: 200, responseText: "// @version 0.9.0" }), 20);
    window.fetch = async () => ({
      ok: true,
      status: 200,
      json: async () => ({ success: true, data: [], groups: [], models: [], tokens: [] }),
    });
    setTimeout(() => {
      const host = document.getElementById("kfcoding-group-switcher-host");
      const root = host && host.shadowRoot;
      if (!root) return;
      const set = (ref, text) => {
        const node = root.querySelector(`[data-ref="${ref}"]`);
        if (node) node.textContent = text;
      };
      set("status", "监控正常，5 个分组中 3 个可用");
      const status = root.querySelector('[data-ref="status"]');
      const statusDot = root.querySelector('[data-ref="statusDot"]');
      if (status) status.dataset.tone = "success";
      if (statusDot) statusDot.dataset.tone = "success";
      set("currentGroup", "default");
      set("bestGroup", "economy");
      set("lastCheck", "11:24:08");
      set("balance", "¥128.42");
      set("todaySpend", "¥6.3800");
      set("todayRequests", "1,284");
      set("todayTokens", "8.42M");
      set("tokenSelectLabel", "生产密钥、备用密钥");
      set("tokenCount", "已选 2/3");
      set("groupFilterSelectLabel", "已排除 2 个分组");
      set("groupFilterCount", "2/8");
      set("spendProtectionStatus", "¥6.38 / ¥10.00 · 64%");
      set("candidateCount", "5");
      set("candidateSummary", "3 可用 / 5 总计");
      set("tokenResultCount", "2");
      set("logCount", "3");
      const rows = root.querySelector('[data-ref="candidateRows"]');
      if (rows) rows.innerHTML = `
        <div class="candidate candidate-ok"><span>economy</span><span class="mono">0.2x</span><span class="mono">99.4%</span><span class="mono">100%</span><span class="mono">680ms</span><span class="mono">4.2s</span><span class="mono">42.8%</span><span class="verdict">可用</span></div>
        <div class="candidate candidate-ok"><span>default</span><span class="mono">1x</span><span class="mono">99.8%</span><span class="mono">100%</span><span class="mono">420ms</span><span class="mono">3.8s</span><span class="mono">51.3%</span><span class="verdict">可用</span></div>
        <div class="candidate candidate-ok"><span>stable-pro</span><span class="mono">1.5x</span><span class="mono">100%</span><span class="mono">100%</span><span class="mono">310ms</span><span class="mono">3.1s</span><span class="mono">63.5%</span><span class="verdict">可用</span></div>
        <div class="candidate candidate-off"><span>promo-night</span><span class="mono">0.1x</span><span class="mono">83.7%</span><span class="mono">0%</span><span class="mono">-</span><span class="mono">-</span><span class="mono">-</span><span class="verdict">近期失败</span></div>
        <div class="candidate candidate-off"><span>legacy-free</span><span class="mono">0x</span><span class="mono">92.1%</span><span class="mono">100%</span><span class="mono">18.4s</span><span class="mono">42.0s</span><span class="mono">8.2%</span><span class="verdict">总成功率</span></div>`;
      const tokenRows = root.querySelector('[data-ref="tokenResultRows"]');
      if (tokenRows) tokenRows.innerHTML = `
        <div class="token-result token-result-success"><span>生产密钥</span><span class="mono">economy</span><span>已切换至策略推荐分组</span></div>
        <div class="token-result token-result-warning"><span>备用密钥</span><span class="mono">default</span><span>保持当前分组，无需切换</span></div>`;
      const logs = root.querySelector('[data-ref="logs"]');
      if (logs) logs.innerHTML = `
        <div class="log log-success"><span class="mono">11:24:08</span><span>检查完成，推荐 economy</span></div>
        <div class="log"><span class="mono">11:20:03</span><span>已刷新今日用量与余额</span></div>
        <div class="log log-warning"><span class="mono">11:10:11</span><span>promo-night 最新成功率不足</span></div>`;
      const previewHtml = {
        candidates: rows ? rows.innerHTML : "",
        tokenResults: tokenRows ? tokenRows.innerHTML : "",
        logs: logs ? logs.innerHTML : "",
      };
      const restorePreviewRows = () => {
        setTimeout(() => {
          set("candidateCount", "5");
          set("candidateSummary", "3 可用 / 5 总计");
          set("tokenResultCount", "2");
          set("logCount", "3");
          if (rows) rows.innerHTML = previewHtml.candidates;
          if (tokenRows) tokenRows.innerHTML = previewHtml.tokenResults;
          if (logs) logs.innerHTML = previewHtml.logs;
        }, 0);
      };
      root.addEventListener("click", (event) => {
        if (event.target.closest("[data-view-target]")) restorePreviewRows();
      });
      root.addEventListener("keydown", (event) => {
        if (event.target.closest("[data-view-target]")) restorePreviewRows();
      });
    }, 400);
  </script>
  <script src="./kfcoding-group-switcher.user.js"></script>
</body>
</html>
