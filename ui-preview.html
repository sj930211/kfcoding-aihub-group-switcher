<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Group switcher UI preview</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; overflow: hidden; background: #18232d; color: #9ba7b1; font: 14px/1.5 sans-serif; }
    .provider-shell { display: grid; grid-template-columns: 224px 1fr; min-height: 100vh; }
    .provider-sidebar { padding: 28px 20px; border-right: 1px solid rgba(255,255,255,.08); background: #0f171e; }
    .provider-brand { margin-bottom: 38px; color: #d8dfe5; font-size: 18px; font-weight: 650; }
    .provider-nav { display: grid; gap: 8px; }
    .provider-nav span { padding: 9px 12px; border-radius: 7px; }
    .provider-nav .active { color: #dceaff; background: rgba(91,169,255,.13); }
    .provider-page { min-width: 0; padding: 30px 34px; }
    .provider-page h1 { margin: 0 0 24px; color: #cfd6dc; font-size: 24px; }
    .provider-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .provider-metric, .provider-chart, .provider-table { border: 1px solid rgba(255,255,255,.09); border-radius: 8px; background: rgba(91,169,255,.045); }
    .provider-metric { height: 82px; padding: 16px; }
    .provider-metric::before, .provider-metric::after, .provider-row span { display: block; border-radius: 3px; background: rgba(255,255,255,.15); content: ""; }
    .provider-metric::before { width: 44%; height: 7px; margin-bottom: 16px; }
    .provider-metric::after { width: 68%; height: 14px; }
    .provider-chart { position: relative; height: 220px; margin-top: 18px; overflow: hidden; background: rgba(7,13,18,.2); }
    .provider-chart div { height: 44px; border-bottom: 1px solid rgba(255,255,255,.07); }
    .provider-chart::after { position: absolute; top: 104px; right: 6%; left: 6%; height: 3px; background: #58d69a; box-shadow: 130px 22px 0 #5ba9ff, 310px -12px 0 #58d69a, 490px 18px 0 #f2b94b; transform: skewY(-4deg); content: ""; }
    .provider-table { margin-top: 18px; overflow: hidden; background: rgba(7,13,18,.16); }
    .provider-row { display: grid; grid-template-columns: 1.4fr repeat(5,1fr); align-items: center; height: 46px; padding: 0 18px; border-bottom: 1px solid rgba(255,255,255,.07); }
    .provider-row span { width: 62%; height: 7px; }
    @media (max-width: 600px) { .provider-shell { grid-template-columns: 1fr; } .provider-sidebar { display: none; } .provider-page { padding: 20px; } .provider-metrics { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <main class="provider-shell" aria-hidden="true">
    <aside class="provider-sidebar"><div class="provider-brand">KFCoding</div><div class="provider-nav"><span>仪表盘</span><span class="active">供应商大厅</span><span>API 密钥</span><span>使用记录</span><span>我的订阅</span><span>个人资料</span></div></aside>
    <section class="provider-page"><h1>供应商大厅</h1><div class="provider-metrics"><div class="provider-metric"></div><div class="provider-metric"></div><div class="provider-metric"></div><div class="provider-metric"></div></div><div class="provider-chart"><div></div><div></div><div></div><div></div></div><div class="provider-table"><div class="provider-row"><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="provider-row"><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="provider-row"><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="provider-row"><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="provider-row"><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="provider-row"><span></span><span></span><span></span><span></span><span></span><span></span></div></div></section>
  </main>
  <script>
    const updateNoticeKey = "kfcoding-aihub-group-switcher:update-notice:v1";
    const previewParams = new URLSearchParams(location.search);
    window.__KFCODING_GROUP_SWITCHER_PREVIEW__ = true;
    window.__KFCODING_GROUP_SWITCHER_PREVIEW_SITE_ID__ = previewParams.get("site") || "kfcoding";
    const previewProviderLabel = { aihub: "AIHub", ooioo: "ooioo", fluxionai: "FluxionAI" }[
      window.__KFCODING_GROUP_SWITCHER_PREVIEW_SITE_ID__
    ] || "KFCoding";
    document.querySelector(".provider-brand").textContent = previewProviderLabel;
    if (previewParams.has("reset-update-notice")) sessionStorage.removeItem(updateNoticeKey);
    const values = new Map();
    values.set("kfcoding-group-switcher:config:v1", { theme: "dark", glassTransparency: 0, enabled: false, models: ["gpt-4.1"], model: "gpt-4.1", selectionMode: "balanced" });
    values.set("aihub-group-switcher:config:v1", { theme: previewParams.get("theme") || "dark", glassTransparency: 0, enabled: false, models: ["gpt-5.6-sol", "gpt-5.6-terra"], model: "gpt-5.6-sol", selectionMode: "balanced" });
    values.set("aihub-group-switcher:ui:v1", {
      activeView: previewParams.has("statistics") ? "statistics" : "monitor",
      statisticsMetric: previewParams.get("metric") || "spend",
      statisticsRange: previewParams.get("range") || previewParams.get("days") || "today",
    });
    values.set("kfcoding-group-switcher:switch-guard:v1", {
      blacklist: [{ model: "gpt-4.1", group: "promo-night", until: Date.now() + 42 * 60 * 1000 }],
    });
    if (sessionStorage.getItem(updateNoticeKey)) {
      values.set(updateNoticeKey, sessionStorage.getItem(updateNoticeKey));
    }
    window.GM_getValue = (key, fallback) => values.has(key) ? values.get(key) : fallback;
    window.GM_setValue = (key, value) => {
      values.set(key, value);
      if (key === updateNoticeKey) sessionStorage.setItem(key, String(value));
    };
    window.GM_registerMenuCommand = () => {};
    window.GM_notification = (notification) => {
      document.documentElement.dataset.notificationCount = String(
        Number(document.documentElement.dataset.notificationCount || 0) + 1,
      );
      document.documentElement.dataset.notificationTitle = String(notification.title || "");
    };
    window.GM_openInTab = () => {};
    const previewVersion = previewParams.has("update") ? "0.15.6" : "0.15.5";
    window.GM_xmlhttpRequest = ({ onload }) => setTimeout(() => onload({ status: 200, responseText: `// @version ${previewVersion}` }), 20);
    const previewKeys = Array.from({ length: 12 }, (_, index) => ({
      id: index + 1,
      name: index === 0 ? "生产主密钥" : index === 1 ? "批处理密钥" : `业务密钥 ${String(index + 1).padStart(2, "0")}`,
      status: "active",
      group_id: 1,
      group: { id: 1, name: "A001-SOL" },
    }));
    const previewMode = previewParams.get("state") || "complete";
    const dateDomain = (start, end) => {
      const dates = [];
      const current = new Date(`${start}T12:00:00`);
      const last = new Date(`${end}T12:00:00`);
      while (current <= last) {
        const year = current.getFullYear();
        const month = String(current.getMonth() + 1).padStart(2, "0");
        const day = String(current.getDate()).padStart(2, "0");
        dates.push(`${year}-${month}-${day}`);
        current.setDate(current.getDate() + 1);
      }
      return dates;
    };
    const jsonResponse = (payload, status = 200) => ({
      ok: status >= 200 && status < 300,
      status,
      json: async () => payload,
    });
    window.fetch = async (input, options = {}) => {
      const url = new URL(String(input), location.origin);
      const method = String(options.method || "GET").toUpperCase();
      document.documentElement.dataset.previewRequestCount = String(
        Number(document.documentElement.dataset.previewRequestCount || 0) + 1,
      );
      if (method !== "GET") {
        document.documentElement.dataset.previewMutationCount = String(
          Number(document.documentElement.dataset.previewMutationCount || 0) + 1,
        );
        return jsonResponse({ message: "preview blocks mutations" }, 405);
      }
      if (previewMode === "loading" && (
        url.pathname === "/api/v1/usage/dashboard/trend"
        || url.pathname.includes("/usage/daily")
      )) {
        await new Promise((resolve) => setTimeout(resolve, 650));
      }
      if (url.pathname === "/api/v1/keys") {
        const page = Number(url.searchParams.get("page")) || 1;
        const size = Number(url.searchParams.get("page_size")) || 100;
        const start = (page - 1) * size;
        return jsonResponse({ items: previewKeys.slice(start, start + size), total: previewKeys.length, page, page_size: size });
      }
      if (url.pathname === "/api/v1/groups/available") {
        return jsonResponse([{ id: 1, name: "A001-SOL", rate_multiplier: 0.08 }]);
      }
      if (url.pathname === "/api/v1/groups/rates") return jsonResponse({ "A001-SOL": 0.08 });
      if (/^\/api\/v[12]\/public\/providers$/.test(url.pathname)) {
        return jsonResponse({
          version: 2,
          generated_at: new Date().toISOString(),
          items: [{
            group_id: 1,
            code: "A001-SOL",
            rate_multiplier: 0.08,
            last_probed_at: new Date().toISOString(),
            probe_e2e_ttft_ms: 880,
            output_tokens: 32,
            output_tps: 48,
            cache_hit_rate: 92.4,
            model_health: { sol: "healthy", terra: "healthy", luna: "healthy", astra: "healthy" },
            success_rates: { "1h": 0.998, "24h": 0.997 },
            enabled: true,
          }],
        });
      }
      if (/^\/api\/v[12]\/public\/providers\/series$/.test(url.pathname)) return jsonResponse({ items: [] });
      if (url.pathname === "/api/v1/usage/stats") {
        return jsonResponse({ actual_cost: 2.48, requests: 286, total_tokens: 1842000 });
      }
      if (url.pathname === "/api/v1/auth/me") return jsonResponse({ balance: 128.42 });
      if (url.pathname === "/api/v1/usage/dashboard/trend") {
        if (previewMode === "error") return jsonResponse({ message: "Authorization header is required" }, 401);
        const granularity = url.searchParams.get("granularity") || "day";
        const today = `${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, "0")}-${String(new Date().getDate()).padStart(2, "0")}`;
        const dates = granularity === "hour"
          ? Array.from({ length: url.searchParams.get("start_date") === today ? Math.max(1, new Date().getHours()) : 24 }, (_, hour) => `${url.searchParams.get("start_date")}T${String(hour).padStart(2, "0")}:00:00`)
          : dateDomain(url.searchParams.get("start_date"), url.searchParams.get("end_date"));
        document.documentElement.dataset.previewTrendGranularity = granularity;
        document.documentElement.dataset.previewTrendPointCount = String(dates.length);
        return jsonResponse({ items: dates.map((date, index) => ({
          date,
          hour: granularity === "hour" ? index : undefined,
          requests: previewMode === "empty" ? 0 : 180 + index * 12,
          input_tokens: previewMode === "empty" ? 0 : 900000 + index * 40000,
          output_tokens: previewMode === "empty" ? 0 : 420000 + index * 18000,
          cache_creation_tokens: 0,
          cache_read_tokens: previewMode === "empty" ? 0 : 520000 + index * 22000,
          total_tokens: previewMode === "empty" ? 0 : 1840000 + index * 80000,
          cost: previewMode === "empty" ? 0 : 6 + index * .15,
          actual_cost: previewMode === "drift" && index === 2
            ? undefined
            : previewMode === "empty" ? 0 : 1.7 + index * .09,
        })) });
      }
      const keyUsageMatch = url.pathname.match(/^\/api\/v1\/user\/api-keys\/(\d+)\/usage\/daily$/);
      if (keyUsageMatch) {
        const id = Number(keyUsageMatch[1]);
        if (previewMode === "partial" && id === 4) return jsonResponse({ message: "该密钥统计暂时不可用" }, 400);
        if (previewMode === "ratelimit" && id === 4) return jsonResponse({ message: "请求过于频繁" }, 429);
        const days = Number(url.searchParams.get("days")) || 7;
        const dates = Array.from({ length: days }, (_, index) => {
          const date = new Date();
          date.setHours(12, 0, 0, 0);
          date.setDate(date.getDate() - (days - index - 1));
          return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
        });
        const multiplier = previewMode === "anomaly" ? 3 : 1;
        return jsonResponse({ items: dates.filter((_, index) => index !== 1 || id % 3 !== 0).map((date, index) => ({
          date,
          requests: previewMode === "empty" ? 0 : id * 2 * multiplier + index,
          input_tokens: previewMode === "empty" ? 0 : id * 9000 * multiplier,
          output_tokens: previewMode === "empty" ? 0 : id * 2500 * multiplier,
          cache_read_tokens: previewMode === "empty" ? 0 : id * 3500 * multiplier,
          cache_write_tokens: 0,
          total_tokens: previewMode === "empty" ? 0 : id * 15000 * multiplier,
          cost: previewMode === "empty" ? 0 : id * .08 * multiplier,
          actual_cost: previewMode === "empty" ? 0 : id * .02 * multiplier,
        })) });
      }
      return jsonResponse({ message: `Unhandled preview request: ${url.pathname}` }, 404);
    };
    setTimeout(() => {
      const host = document.getElementById("kfcoding-group-switcher-host")
        || document.getElementById("aihub-group-switcher-host")
        || document.getElementById("ooioo-group-switcher-host")
        || document.getElementById("fluxionai-group-switcher-host");
      const root = host && host.shadowRoot;
      if (!root) return;
      const set = (ref, text) => {
        const node = root.querySelector(`[data-ref="${ref}"]`);
        if (node) node.textContent = text;
      };
      set("status", "监控正常，5 个分组中 3 个可用");
      const status = root.querySelector('[data-ref="status"]');
      const statusDot = root.querySelector('[data-ref="statusDot"]');
      if (status) status.dataset.tone = "success";
      if (statusDot) statusDot.dataset.tone = "success";
      set("currentGroup", "default");
      set("bestGroup", "economy");
      set("lastCheck", "11:24:08");
      set("balance", "¥128.42");
      set("todaySpend", "¥6.3800");
      set("todayRequests", "1,284");
      set("todayTokens", "8.42M");
      set("tokenSelectLabel", "生产密钥、备用密钥");
      set("tokenCount", "已选 2/3");
      set("groupFilterSelectLabel", "已排除 2 个分组");
      set("groupFilterCount", "2/8");
      set("spendProtectionStatus", "¥6.38 / ¥10.00 · 64%");
      set("candidateCount", "5");
      set("candidateSummary", "3 可用 / 5 总计");
      set("tokenResultCount", "2");
      set("logCount", "3");
      const rows = root.querySelector('[data-ref="candidateRows"]');
      if (rows) rows.innerHTML = `
        <div class="candidate candidate-ok"><span class="candidate-name"><span class="candidate-signal"></span><span class="candidate-name-label">economy</span></span><span class="mono">0.2x</span><span class="mono">99.4%</span><span class="mono health-value" style="--health:100%">100%</span><span class="mono">680ms</span><span class="mono">4.2s</span><span class="mono">42.8%</span><span class="verdict">可用</span></div>
        <div class="candidate candidate-ok"><span class="candidate-name"><span class="candidate-signal"></span><span class="candidate-name-label">default</span></span><span class="mono">1x</span><span class="mono">99.8%</span><span class="mono health-value" style="--health:100%">100%</span><span class="mono">420ms</span><span class="mono">3.8s</span><span class="mono">51.3%</span><span class="verdict">可用</span></div>
        <div class="candidate candidate-ok"><span class="candidate-name"><span class="candidate-signal"></span><span class="candidate-name-label">stable-pro</span></span><span class="mono">1.5x</span><span class="mono">100%</span><span class="mono health-value" style="--health:100%">100%</span><span class="mono">310ms</span><span class="mono">3.1s</span><span class="mono">63.5%</span><span class="verdict">可用</span></div>
        <div class="candidate candidate-off"><span class="candidate-name"><span class="candidate-signal"></span><span class="candidate-name-label">promo-night</span></span><span class="mono">0.1x</span><span class="mono">83.7%</span><span class="mono health-value" style="--health:0%">0%</span><span class="mono">-</span><span class="mono">-</span><span class="mono">-</span><span class="verdict">近期失败</span></div>
        <div class="candidate candidate-off"><span class="candidate-name"><span class="candidate-signal"></span><span class="candidate-name-label">legacy-free</span></span><span class="mono">0x</span><span class="mono">92.1%</span><span class="mono health-value" style="--health:100%">100%</span><span class="mono">18.4s</span><span class="mono">42.0s</span><span class="mono">8.2%</span><span class="verdict">总成功率</span></div>`;
      const tokenRows = root.querySelector('[data-ref="tokenResultRows"]');
      if (tokenRows) tokenRows.innerHTML = `
        <div class="token-result token-result-success"><span>生产密钥</span><span class="mono">economy</span><span>已切换至策略推荐分组</span></div>
        <div class="token-result token-result-warning"><span>备用密钥</span><span class="mono">default</span><span>保持当前分组，无需切换</span></div>`;
      const logs = root.querySelector('[data-ref="logs"]');
      if (logs) logs.innerHTML = `
        <div class="log log-success"><span class="mono">11:24:08</span><span>检查完成，推荐 economy</span></div>
        <div class="log"><span class="mono">11:20:03</span><span>已刷新今日用量与余额</span></div>
        <div class="log log-warning"><span class="mono">11:10:11</span><span>promo-night 最新成功率不足</span></div>`;
      const previewHtml = {
        candidates: rows ? rows.innerHTML : "",
        tokenResults: tokenRows ? tokenRows.innerHTML : "",
        logs: logs ? logs.innerHTML : "",
      };
      const restorePreviewRows = () => {
        setTimeout(() => {
          set("status", "监控正常，5 个分组中 3 个可用");
          if (status) status.dataset.tone = "success";
          if (statusDot) statusDot.dataset.tone = "success";
          set("currentGroup", "default");
          set("bestGroup", "economy");
          set("lastCheck", "11:24:08");
          set("balance", "¥128.42");
          set("todaySpend", "¥6.3800");
          set("todayRequests", "1,284");
          set("todayTokens", "8.42M");
          set("candidateCount", "5");
          set("candidateSummary", "3 可用 / 5 总计");
          set("tokenResultCount", "2");
          set("logCount", "3");
          if (rows) rows.innerHTML = previewHtml.candidates;
          if (tokenRows) tokenRows.innerHTML = previewHtml.tokenResults;
          if (logs) logs.innerHTML = previewHtml.logs;
        }, 0);
      };
      root.addEventListener("click", (event) => {
        if (event.target.closest("[data-view-target]")) restorePreviewRows();
      });
      root.addEventListener("keydown", (event) => {
        if (event.target.closest("[data-view-target]")) restorePreviewRows();
      });
    }, 400);
  </script>
  <script src="./kfcoding-group-switcher.user.js"></script>
</body>
</html>
